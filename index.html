<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>机器视觉实验室物料管理系统</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
  <header class="toolbar">
    <h1>机器视觉实验室物料管理系统</h1>
    <div class="toolbar-actions">
      <input type="file" id="importFile" accept=".xlsx,.xls" hidden>
      <input type="file" id="syncFile" accept=".xlsx,.xls" hidden>
      <button id="btnImport">📥 导入 Excel</button>
      <button id="btnSync">🔄 更新同步</button>
      <button id="btnExport">📤 导出物料</button>
      <button id="btnExportBorrow">📋 导出借出</button>
      <button id="btnAdd">➕ 新增入库</button>
      <button id="btnSettings">⚙️ 设置</button>
    </div>
  </header>

  <div class="filter-bar">
    <label>筛选：</label>
    <select id="categoryFilter"></select>
    <input type="search" id="searchBox" placeholder="搜索物料名称 / 描述 / 编码...">
    <span id="modeBadge" class="badge"></span>
  </div>

  <main class="layout">
    <section class="table-panel">
      <table id="materialsTable">
        <thead>
          <tr>
            <th>物料描述</th><th>数量</th><th>存放位置</th><th>分类</th><th>借出状态</th><th>备注</th><th>操作</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <div id="emptyHint" class="empty-hint" hidden>暂无物料数据</div>
    </section>

    <aside class="side-panel">
      <h2>📊 数据统计</h2>
      <div class="stat-grid">
        <div class="stat"><label>物料总数</label><b id="statTotal">0</b></div>
        <div class="stat"><label>库存总量</label><b id="statQty">0</b></div>
        <div class="stat"><label>借出在用</label><b id="statBorrowed">0</b></div>
        <div class="stat"><label>当前筛选</label><b id="statFiltered">0</b></div>
      </div>
      <h2>📋 借出登记记录</h2>
      <div id="borrowList" class="borrow-list"></div>
    </aside>
  </main>

  <section class="ops">
    <div class="ops-input">
      <input id="nlInput" type="text" placeholder="5月17日，李晓源借出CL042-91GM一台">
      <button id="btnExec">执 行</button>
    </div>
    <div class="help-text">借出/归还完整格式：5月17日，李晓源借出CL042-91GM一台 ｜ 新增入库 物料名 数量 ｜ 报废 物料名 数量</div>
  </section>

  <section class="logs">
    <h2>操作日志（最近 50 条）</h2>
    <div id="logList" class="log-list"></div>
  </section>

  <!-- 弹窗：借出（无需密码） -->
  <dialog id="dlgBorrow">
    <div class="dlg-head"><h3>借出物料（无需密码）</h3></div>
    <div class="dlg-body">
      <p class="dlg-field"><label>物料</label><b id="borrowMaterialLabel"></b></p>
      <p class="dlg-field"><label>借用人</label><input id="borrowPerson" type="text" placeholder="请输入借用人姓名"></p>
      <p class="dlg-field"><label>数量</label><input id="borrowQty" type="number" min="1" value="1"></p>
    </div>
    <div class="dlg-foot">
      <button id="borrowOk" class="btn-primary">确认借出</button>
      <button id="borrowCancel" class="btn-plain">取消</button>
    </div>
  </dialog>

  <!-- 弹窗：归还（需密码） -->
  <dialog id="dlgReturn">
    <div class="dlg-head"><h3>归还物料（需密码）</h3></div>
    <div class="dlg-body">
      <p class="dlg-field"><label>物料</label><b id="returnMaterialLabel"></b></p>
      <p class="dlg-field"><label>还回密码</label><input id="returnPassword" type="password" placeholder="请输入还回密码"></p>
      <p class="dlg-field"><label>借用人</label><input id="returnPerson" type="text" placeholder="借用人姓名"></p>
      <p class="dlg-field"><label>数量</label><input id="returnQty" type="number" min="1" value="1"></p>
    </div>
    <div class="dlg-foot">
      <button id="returnOk" class="btn-primary">确认归还</button>
      <button id="returnCancel" class="btn-plain">取消</button>
    </div>
  </dialog>

  <!-- 弹窗：新增入库 -->
  <dialog id="dlgAdd">
    <div class="dlg-head"><h3>新增入库</h3></div>
    <div class="dlg-body">
      <p class="dlg-field"><label>物料名称</label><input id="addName" type="text" placeholder="物料名称 / 描述"></p>
      <p class="dlg-field"><label>数量</label><input id="addQty" type="number" min="1" value="1"></p>
      <p class="dlg-field"><label>存放位置</label><input id="addLocation" type="text" placeholder="可选"></p>
      <p class="dlg-field"><label>备注</label><input id="addRemark" type="text" placeholder="可选"></p>
    </div>
    <div class="dlg-foot">
      <button id="addOk" class="btn-primary">确认入库</button>
      <button id="addCancel" class="btn-plain">取消</button>
    </div>
  </dialog>

  <!-- 弹窗：报废 -->
  <dialog id="dlgScrap">
    <div class="dlg-head"><h3>闲置报废</h3></div>
    <div class="dlg-body">
      <p class="dlg-field"><label>物料</label><b id="scrapMaterialLabel"></b></p>
      <p class="dlg-field"><label>数量</label><input id="scrapQty" type="number" min="1" value="1"></p>
    </div>
    <div class="dlg-foot">
      <button id="scrapOk" class="btn-primary">确认报废</button>
      <button id="scrapCancel" class="btn-plain">取消</button>
    </div>
  </dialog>

  <!-- 弹窗：设置（修改还回密码） -->
  <dialog id="dlgSettings">
    <div class="dlg-head"><h3>设置</h3></div>
    <div class="dlg-body">
      <p class="dlg-field"><label>存储模式</label><b id="settingsMode"></b></p>
      <hr>
      <p class="dlg-field"><label>旧密码</label><input id="oldPwd" type="password" placeholder="当前还回密码"></p>
      <p class="dlg-field"><label>新密码</label><input id="newPwd" type="password" placeholder="新还回密码"></p>
      <p class="dlg-field"><label>确认新密码</label><input id="newPwd2" type="password" placeholder="再次输入新密码"></p>
      <p class="dlg-hint">仅修改「还回」所需密码；借出始终无需密码。GitHub 仓库/Token 请在 js/config.js 中配置。</p>
    </div>
    <div class="dlg-foot">
      <button id="pwdOk" class="btn-primary">修改密码</button>
      <button id="settingsCancel" class="btn-plain">关闭</button>
    </div>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
